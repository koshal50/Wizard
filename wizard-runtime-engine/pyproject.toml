[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-kernel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
# Agentic browser (opt-in). The ONLY new dependency; uvicorn[standard] already
# bundles websockets, so the screencast endpoint needs no new server dep.
# After install:  playwright install chromium
browser = ["playwright>=1.48"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
