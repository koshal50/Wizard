<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wizard — Live Browser</title>
<style>
  /* Two panes and nothing else: the page the agent is driving on the left, and
     a narrow overlay on the right that answers exactly two questions — what is
     it doing now, and what will it do next. The previous revision stacked a
     scrolling event log beside the frame, which buried those two answers in a
     stream of everything that had ever happened. */
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --fg: #e6edf3;
    --muted: #8b949e; --accent: #2f81f7; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
    --violet: #a371f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
           background: var(--panel); border-bottom: 1px solid var(--border); flex: none; }
  header h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .id { color: var(--muted); }
  header .spacer { flex: 1; }
  .pill { color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
          padding: 2px 9px; white-space: nowrap; }
  .pill b { color: var(--fg); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
         display: inline-block; flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.off { background: var(--bad); }

  main { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

  /* ── Left: the browsing pane ─────────────────────────────────────────────── */
  #stage { position: relative; display: flex; align-items: center; justify-content: center;
           background: #010409; min-height: 0; overflow: hidden; }
  #frame { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* The pane is never allowed to be silently blank. A white Chromium page and a
     browser that has not started look the same as an image, so the state is
     always named in words on top of it. */
  #veil { position: absolute; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 10px;
          text-align: center; padding: 24px; color: var(--muted); background: #010409; }
  #veil h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--fg); }
  #veil p { margin: 0; max-width: 46ch; }
  #veil code { color: var(--accent); }
  .spin { width: 15px; height: 15px; border: 2px solid var(--border);
          border-top-color: var(--accent); border-radius: 50%; animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Right: the agent overlay ────────────────────────────────────────────── */
  #overlay { border-left: 1px solid var(--border); background: #0b0f14;
             overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 760px) { #overlay { border-left: none; border-top: 1px solid var(--border); max-height: 45vh; } }

  .block > h3 { margin: 0 0 7px; font-size: 10px; letter-spacing: 1.2px;
                text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-left: 3px solid var(--border); border-radius: 4px; padding: 9px 10px; }
  .card.now { border-left-color: var(--accent); }
  .card.done { border-left-color: var(--ok); }
  .card.failed { border-left-color: var(--bad); }
  .card .tool { font-weight: 600; color: var(--fg); }
  .card .meta { color: var(--muted); }
  .card .params { color: var(--muted); margin-top: 3px; word-break: break-all; }
  .card .goal { color: var(--violet); margin-top: 3px; }
  .card .type { color: var(--muted); font-size: 11px; }
  .card .id { color: #4d5866; font-size: 10px; margin-top: 4px; }

  ol.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  ol.queue li { background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
                padding: 7px 9px; color: var(--muted); }
  ol.queue li .tool { color: var(--fg); font-weight: 600; }
  ol.queue li .params { word-break: break-all; }
  ol.queue li.more { background: none; border: none; color: #4d5866; padding-left: 0; }

  .empty { color: #4d5866; font-style: italic; }
  .waiting { color: var(--muted); }
  .bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="wsdot"></span>
    <h1>Live browser</h1>
    <span class="id" id="invid"></span>
    <span class="spacer"></span>
    <span class="pill" id="p-status">—</span>
    <span class="pill">nodes <b id="p-nodes">0</b></span>
    <span class="pill">claims <b id="p-claims">0</b></span>
    <span class="pill">budget <b id="p-budget">—</b></span>
  </header>

  <main>
    <section id="stage">
      <div id="veil">
        <div class="spin" id="veil-spin"></div>
        <h2 id="veil-title">connecting…</h2>
        <p id="veil-body">looking for a browser plane on this investigation</p>
      </div>
      <img id="frame" alt="the page the agent is driving" hidden />
    </section>

    <aside id="overlay">
      <div class="block">
        <h3>Now</h3>
        <div id="now"><div class="empty">nothing running</div></div>
      </div>

      <div class="block">
        <h3>Next</h3>
        <ol class="queue" id="next"><li class="more">the queue is empty</li></ol>
      </div>

      <div class="block">
        <h3>Last observed</h3>
        <div id="last"><div class="empty">no browser activity yet</div></div>
      </div>
    </aside>
  </main>

<script>
(() => {
  "use strict";
  // Investigation id from /v1/investigations/{id}/live
  const parts = location.pathname.split("/").filter(Boolean);
  const invId = parts[parts.indexOf("investigations") + 1] || "";
  document.getElementById("invid").textContent = invId;

  const $ = (id) => document.getElementById(id);
  const frameEl = $("frame"), veil = $("veil"), veilTitle = $("veil-title"),
        veilBody = $("veil-body"), veilSpin = $("veil-spin"), wsdot = $("wsdot");
  const nowEl = $("now"), nextEl = $("next"), lastEl = $("last");

  // Every value below reaches the DOM from the Runtime, and some of it is text
  // the driven page supplied (a title, a URL). It is inserted as text, never as
  // markup: this page shares an origin with the API, so an injected <script>
  // here would run with the viewer's session.
  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  /** A node as one compact card: what it will run, on what, for which goal. */
  function nodeCard(n, cls) {
    const params = n.params && Object.keys(n.params).length
      ? `<div class="params">${esc(JSON.stringify(n.params))}</div>` : "";
    const goal = n.goal_id ? `<div class="goal">goal ${esc(n.goal_id)}</div>` : "";
    return `<div class="card ${cls}">
        <div><span class="tool">${esc(n.tool || n.type)}</span>
             <span class="type">${esc(n.type)}</span></div>
        ${params}${goal}
        <div class="id">${esc(n.node_id)}</div>
      </div>`;
  }

  function renderFrontier(f) {
    // Header counters
    $("p-status").textContent = f.status || "—";
    $("p-nodes").textContent = f.nodes_completed ?? 0;
    $("p-claims").textContent = f.claims_count ?? 0;
    $("p-budget").textContent = f.budget_remaining ?? "—";

    // NOW
    nowEl.innerHTML = f.now
      ? nodeCard(f.now, "now")
      : `<div class="empty">${f.status === "completed" ? "finished" : "between nodes"}</div>`;

    // NEXT
    const next = f.next || [];
    const neverRan = f.counts ? (f.counts.never_ran || 0) : 0;
    nextEl.innerHTML = next.length
      ? next.map((n) => `<li><span class="tool">${esc(n.tool || n.type)}</span>
           <span class="type">${esc(n.type)}</span>
           ${n.params && Object.keys(n.params).length
             ? `<div class="params">${esc(JSON.stringify(n.params))}</div>` : ""}</li>`).join("")
        + (f.counts && f.counts.waiting > next.length
            ? `<li class="more">… ${f.counts.waiting - next.length} more queued</li>` : "")
      : `<li class="more">${emptyNextText(f.status, neverRan)}</li>`;

    return f;
  }

  /**
   * What to say under "Next" when nothing is queued.
   *
   * A finished run can still have planned nodes that were never needed: the loop
   * stops the moment every goal is satisfied, so work queued behind those goals
   * stays unrun. Saying a bare "nothing left to do" would hide that, and the
   * viewer has no other way to see it — so it is said out loud.
   */
  function emptyNextText(status, neverRan) {
    if (status === "completed") {
      return neverRan
        ? `nothing left to do — ${neverRan} planned node${neverRan === 1 ? "" : "s"} turned out to be unnecessary`
        : "nothing left to do";
    }
    if (status === "failed") return "the run stopped before finishing its plan";
    if (status === "cancelled") return "the run was cancelled";
    return "waiting on the planner";
  }

  /**
   * The one place that decides what the veil says.
   *
   * Two things know why the pane is empty: the frontier poll (which knows
   * whether a browser plane exists at all, and whether the run has ended) and
   * the screencast socket (which only knows it was refused). They arrive in
   * either order, and when the socket's error was written directly it won —
   * leaving a late viewer of a finished run staring at "no live browser for
   * this investigation" instead of the real reason. So neither writes the veil;
   * both refresh it, and the frontier — which knows strictly more — wins
   * whenever it has been heard from.
   */
  function renderVeil() {
    if (frameSeen) return;
    if (lastFrontier) { explainEmpty(lastFrontier); return; }
    if (socketError) {
      veilSpin.hidden = true;
      veilTitle.textContent = "no live browser";
      veilBody.textContent = socketError;
    }
  }

  /** Why the pane is empty, in words. Called only while no frame has arrived. */
  function explainEmpty(f) {
    if (f && f.browser_enabled === false) {
      veilSpin.hidden = true;
      veilTitle.textContent = "no browser plane for this investigation";
      veilBody.innerHTML = "This run was started without one, so there is nothing " +
        "to stream. Name a URL in your intent (or set <code>WIZARD_BROWSER=1</code>) " +
        "and run again.";
      return;
    }
    // The run is over and no frame ever arrived. "Waiting for the first frame"
    // would be a lie the viewer has no way to detect — the wait has ended, and
    // nothing is coming. A finished investigation never gets a browser again.
    //
    // Which ending it was matters: a browser lives only as long as its
    // investigation, so a page that opened perfectly still streams nothing to
    // someone who arrives after the run. Saying "no page was ever opened" there
    // would send the user to debug a browser that worked.
    if (f && (f.status === "completed" || f.status === "failed")) {
      veilSpin.hidden = true;
      const targets = f.browser_targets || [];
      const opened = f.pages_opened || [];
      if (opened.length) {
        veilTitle.textContent = "the browser ran — this view was opened after it closed";
        veilBody.innerHTML = "The agent opened <code>" + esc(opened[0]) +
          "</code> and the run has since finished. Frames stream only while the " +
          "run is live, so the picture is gone; open this page from the start of " +
          "a run to watch it.";
        return;
      }
      veilTitle.textContent = "no page was ever opened";
      veilBody.innerHTML = f.status === "failed"
        ? "The run failed before the agent reached a page."
        : targets.length
          ? `The run finished before the agent opened <code>${esc(targets[0])}</code>.`
          : "No URL was named for this run, so the agent never had a page to open.";
      return;
    }
    if (f && f.browser_enabled && !(f.browser_targets || []).length) {
      veilTitle.textContent = "browser ready — waiting for the agent to navigate";
      veilBody.innerHTML = "No URL was named for this run, so the planner has not " +
        "asked for a page yet.";
      return;
    }
    veilTitle.textContent = "waiting for the first frame";
    veilBody.innerHTML = f && (f.browser_targets || []).length
      ? `the agent will open <code>${esc(f.browser_targets[0])}</code> — the picture appears here`
      : "the picture appears here as soon as the agent opens a page";
  }

  // ── Frontier: what is running now, and what is queued next ────────────────
  let lastStatus = "", frameSeen = false, lastNodeId = "";
  let lastFrontier = null, socketError = "";
  async function pollFrontier() {
    try {
      const r = await fetch(`/v1/investigations/${invId}/frontier`);
      if (r.ok) {
        const f = renderFrontier(await r.json());
        lastStatus = f.status || "";
        lastFrontier = f;
        renderVeil();
        // Announce a node change once. This is the "recent activity" line — it
        // exists so the overlay still says something useful in the gap between
        // two nodes, without growing into a scrolling log.
        if (f.now && f.now.node_id !== lastNodeId) {
          lastNodeId = f.now.node_id;
          lastEl.innerHTML = nodeCard(f.now, "");
        }
      }
    } catch (_) { /* transient — keep polling */ }
    setTimeout(pollFrontier, lastStatus === "completed" || lastStatus === "failed" ? 4000 : 900);
  }
  pollFrontier();

  // ── Pixels: screencast WebSocket (CDP frames, base64 JPEG) ────────────────
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  function connect() {
    const ws = new WebSocket(`${proto}//${location.host}/v1/investigations/${invId}/screencast`);
    ws.onopen = () => { wsdot.classList.add("on"); socketError = ""; };
    ws.onclose = () => {
      wsdot.classList.remove("on");
      // Stop once the run is over. A finished investigation never gets a browser
      // again, so retrying every 2s would hammer the server forever for a socket
      // that can only be refused — and the last frame already on screen is the
      // finished picture of the run.
      if (lastStatus === "completed" || lastStatus === "failed") return;
      setTimeout(connect, 2000);
    };
    ws.onerror = () => wsdot.classList.remove("on");
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "frame") {
        frameSeen = true;
        frameEl.hidden = false; veil.hidden = true;
        // A data: URI, so the driven page's own JavaScript never runs here.
        frameEl.src = "data:image/jpeg;base64," + msg.data;
      } else if (msg.type === "error") {
        socketError = msg.message || "the Runtime reported no browser for this investigation";
        renderVeil();
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
