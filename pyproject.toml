[project]
name = "wizard"
version = "0.2.0"
description = "Intent Translation Layer — translate user commands into structured runtime requests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Wizard Contributors" },
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
wizard = "wizard.cli.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wizard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
