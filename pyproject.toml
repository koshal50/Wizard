[project]
name = "wizard"
version = "0.1.0"
description = "Open-source repository intelligence CLI -- analyze codebases with zero execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Wizard Contributors" },
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "rich-click>=1.7.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
wizard = "wizard.cli.app:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wizard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
