[project]
name = "wizard"
version = "0.2.0"
description = "Evidence-driven repository investigation — a CLI, an exploration/verification agent pair, a TypeScript investigation planner, and the Runtime Engine they all run on."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Wizard Contributors" },
]

# Everything the four modules need at runtime, in one place, so a fresh clone is
# `pip install -e .` and nothing else. The modules are separate directories but
# one product: the CLI drives the Runtime Engine over HTTP, and the Engine
# reaches the planner and the two agents through the same request options, so
# installing a subset gives a wizard that starts and then explains, at runtime,
# which seam is missing.
dependencies = [
    # The CLI and the TUI.
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    # Image handling for the standalone `pixelart.py` tool.
    "Pillow>=10.0.0",
    # The Runtime Engine and the agent service (both are FastAPI apps served by
    # uvicorn; the planner is TypeScript and needs Node instead — see README).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # The agentic browser. The package is all pip can install: Playwright
    # downloads its browser binaries from its own CDN, and pip has no
    # post-install step to run that for you. `wizard` fetches Chromium itself on
    # first launch — see ensure_chromium in wizard/cli/tui/services.py — so this
    # dependency plus a first run is enough.
    "playwright>=1.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6",
]

[project.scripts]
wizard = "wizard.cli.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# Two package roots, one install. `wizard` is the CLI at the repository root;
# `wizard_kernel` is the Runtime Engine under wizard-runtime-engine/src, which
# the CLI imports directly (its factories are the contract test for the seam
# options) and which the service supervisor starts with `uvicorn
# wizard_kernel.main:app`. Naming both roots here is what makes a single
# `pip install -e .` from the repository root enough.
[tool.setuptools.packages.find]
where = [".", "wizard-runtime-engine/src"]
include = ["wizard", "wizard.*", "wizard_kernel", "wizard_kernel.*"]

[tool.pytest.ini_options]
testpaths = ["wizard/tests"]
pythonpath = ["."]
